name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    # این خط به ربات میگه: برو داخل پوشه daria-launcher
    defaults:
      run:
        working-directory: ./daria-launcher

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Fix gradlew permissions
      run: |
        chmod +x gradlew
        sed -i 's/\r$//' gradlew

    - name: Build debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        # اینجا هم مسیر فایل خروجی رو اصلاح کردیم
        path: daria-launcher/app/build/outputs/apk/debug/app-debug.apk
