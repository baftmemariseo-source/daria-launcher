name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # مرحله اصلاح مجوزها، مسیر working-directory را اینجا مشخص می‌کنیم
    - name: Fix gradlew permissions
      working-directory: ./daria-launcher
      run: |
        chmod +x gradlew
        sed -i 's/\r$//' gradlew

    # مرحله Build، مسیر working-directory را اینجا مشخص می‌کنیم
    - name: Build debug APK
      working-directory: ./daria-launcher
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        # مسیر فایل خروجی از ریشه مخزن حساب می‌شود
        path: daria-launcher/app/build/outputs/apk/debug/app-debug.apk
